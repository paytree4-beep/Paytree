name: Unzip project
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shopt -s nullglob
          for z in *.zip; do unzip -o "$z" -d . && git rm -q "$z"; done
          mkdir -p design
          for f in *.dc.html; do git mv "$f" design/; done
          git config user.name "paytree4-beep"
          git config user.email "paytree4@gmail.com"
          git add -A
          git commit -m "Unpack project files" && git push
